name: Build

# Builds and tests every push to main and every pull request, so a broken change shows up before a release tag.
on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore GS.Point3DNina.slnx

      - name: Build
        run: dotnet build GS.Point3DNina.slnx -c Release --no-restore

      - name: Test
        run: dotnet test GS.Point3DNina.slnx -c Release --no-build --no-restore

      # The plugin is built against the newest NINA package, but Plugin.props promises it works from MinimumNinaVersion.
      # Compiling against that version catches use of an API added since. Raise MinimumNinaVersion if this fails.
      - name: Build against the minimum NINA version
        shell: pwsh
        run: |
          $project = 'src/GS.Point3DNina/GS.Point3DNina.csproj'
          $min = (dotnet msbuild $project -getProperty:MinimumNinaVersion).Trim()
          if ($LASTEXITCODE -or !$min) { throw 'Could not read MinimumNinaVersion.' }
          dotnet build $project -c Release "-p:NinaPackageVersion=$min-nightly" -o "$env:RUNNER_TEMP/min-nina"
          if ($LASTEXITCODE) { throw "The plugin does not build against NINA $min. Raise MinimumNinaVersion in Plugin.props." }
