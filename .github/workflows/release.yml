name: Release

# Push a tag named vMAJOR.MINOR.PATCH.BUILD (for example v1.0.1.0) to build and publish a release.
# The tag is the version: the plugin's assembly, file and manifest versions all come from it, so a new tag is a new
# version. NINA needs four numeric parts, and each must be between 0 and 65534.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Restores, builds, runs the tests and packages the plugin into artifacts/release (a zip and a manifest). The
      # script reads the version from the tag and writes this repository's release download address into the manifest.
      - name: Build, test and package
        shell: pwsh
        run: ./build/Build-Release.ps1 -Tag '${{ github.ref_name }}' -Repository '${{ github.repository }}'

      - name: Verify the archive and manifest
        shell: pwsh
        run: ./build/Verify-ReleaseArtifacts.ps1 -Directory artifacts/release -Tag '${{ github.ref_name }}' -Repository '${{ github.repository }}'

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem artifacts/release -File | ForEach-Object FullName
          gh release create '${{ github.ref_name }}' @files --repo '${{ github.repository }}' --title '${{ github.ref_name }}' --generate-notes --verify-tag
          if ($LASTEXITCODE) { throw "gh release create failed with exit code $LASTEXITCODE." }

      - name: Keep the build output
        uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ github.ref_name }}
          path: artifacts/release/*
