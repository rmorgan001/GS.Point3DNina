<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GS.Point3D</title>
<style>
  /* The palette model3d.js reads its scene colours from (the web app's dark theme). */
  :root {
    --sky: #070b0e; --panel: #10181c; --panel-raised: #172226; --well: #0a1114;
    --line: #22313a; --line-strong: #2f4552; --moon: #e8e6df; --mare: #9aa5a8;
    --green: #52b788; --yellow: #f2c84b; --red: #ef6461;
  }
  /* The other themes: only the variables change, so the page and the scene follow (the same palettes as Green Swamp's apps). */
  :root[data-theme="day"] {
    color-scheme: light;
    --sky: #f4f7f8; --panel: #ffffff; --panel-raised: #eef3f5; --well: #fbfcfd;
    --line: #d5dde2; --line-strong: #b9c6cd; --moon: #14202a; --mare: #51636f;
    --green: #1f7a52; --green-hover: #16633f; --green-ink: #ffffff; --yellow: #8a6100; --red: #b3261e;
  }
  :root[data-theme="dusk"] {
    color-scheme: dark;
    --sky: #0a0500; --panel: #140a02; --panel-raised: #1d1004; --well: #0e0701;
    --line: #2e1c0a; --line-strong: #4a2e12; --moon: #ffb066; --mare: #c08040;
    --green: #e0a050; --green-hover: #f0b868; --green-ink: #1a0d00; --yellow: #ffb066; --red: #ff6a3d;
  }
  :root[data-theme="night"] {
    color-scheme: dark;
    --sky: #000000; --panel: #0d0000; --panel-raised: #170000; --well: #080000;
    --line: #3a0000; --line-strong: #5a0000; --moon: #ff2020; --mare: #e01818;
    --green: #ff2020; --green-hover: #ff4040; --green-ink: #000000; --yellow: #ff2020; --red: #ff2020;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--well); }
  canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
  /* Compass readout: a dial whose needle points north on screen (red tip) and the bearing the camera faces.
     model3d.js turns the needle and writes the value. It's a button: a click turns the view to face north. */
  /* Coordinate chips over the top of the scene: RA, Dec, Az, Alt, hour angle and sidereal time of the mount. */
  #coords { position: absolute; top: 8px; left: 8px; right: 8px; z-index: 1; display: flex; flex-wrap: wrap; gap: 6px; pointer-events: none; }
  #coords:empty { display: none; }
  .coord {
    display: inline-flex; align-items: baseline; gap: 6px; padding: 3px 9px; pointer-events: auto;
    border: 1px solid var(--line); border-radius: 6px;
    background: color-mix(in srgb, var(--sky) 72%, transparent); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  .coord.ra { cursor: pointer; user-select: none; }
  .coord .label { font: 600 11px Segoe UI, sans-serif; letter-spacing: .06em; text-transform: uppercase; color: var(--yellow); }
  .coord .value { font: 13px Consolas, monospace; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--moon); }
  #heading {
    position: absolute; right: 8px; bottom: 8px; z-index: 1;
    display: inline-flex; align-items: center; gap: 7px; padding: 4px 9px 4px 5px;
    font: inherit; color: var(--moon); cursor: pointer;
    border: 1px solid var(--line); border-radius: 6px;
    background: color-mix(in srgb, var(--sky) 72%, transparent); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    transition: border-color .15s;
  }
  #heading[hidden] { display: none; }
  #heading:hover { border-color: var(--green); }
  #heading:focus-visible { outline: 2px solid #f2c84b; outline-offset: 2px; }
  .heading-dial { position: relative; width: 27px; height: 27px; border: 1px solid var(--line); border-radius: 50%; flex: none; }
  .heading-needle { position: absolute; inset: 0; transition: transform .12s linear; }
  .heading-needle::before, .heading-needle::after {
    content: ""; position: absolute; left: 50%; width: 0; height: 0;
    border-left: 3px solid transparent; border-right: 3px solid transparent; transform: translateX(-50%);
  }
  .heading-needle::before { top: 2px; border-bottom: 10px solid var(--red); }
  .heading-needle::after { bottom: 2px; border-top: 10px solid var(--moon); }
  .heading-value {
    min-width: 2.6em; font: 13px Consolas, monospace; font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  #msg { position: absolute; left: 8px; bottom: 8px; color: var(--red); font: 12px Segoe UI, sans-serif; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<button type="button" id="heading" hidden
        title="Which way the camera is facing (compass bearing); the red tip points north. Click to turn the view to face the pole: north, or south at a southern latitude."
        aria-label="Which way the camera is facing (compass bearing); the red tip points north. Click to turn the view to face the pole: north, or south at a southern latitude.">
  <span class="heading-dial" aria-hidden="true"><span class="heading-needle"></span></span>
  <span class="heading-value"></span>
</button>
<div id="coords" aria-label="Mount coordinates"></div>
<div id="msg"></div>
<script type="module">
  import * as m from './model3d/model3d.js';

  const post = o => window.chrome.webview.postMessage(o);
  let viewer = null;
  let queue = Promise.resolve();

  // The host sends { cmd, ...args }; commands run in order, because create and loadModel are asynchronous.
  const commands = {
    create: async a => {
      commands.setTheme({ theme: a.options?.theme }, false);
      viewer = await m.create(document.getElementById('c'), a.options);
      commands.setHeading({ visible: a.options?.heading === true });
      post({ event: 'created' });
    },
    loadModel: async a => {
      const result = await m.loadModel(viewer, a.url, a.mount);
      post({ event: 'modelLoaded', result: String(result ?? '') });
    },
    setPose: a => m.setPose(viewer, a.x, a.y, a.z, a.yCentre),
    setCamera: a => m.setCamera(viewer, a.view),
    setModelColor: a => m.setModelColor(viewer, a.hex),
    setBackground: a => m.setBackground(viewer, a.background),
    // How long the model may glide to a new pose: the host sends it again when the panel is shown, in case NINA's polling interval changed.
    setMaxGlide: a => m.setMaxGlide(viewer, a.ms),
    // The bearing the compass readout turns the view to when clicked: north, or south for a southern latitude.
    setFaceBearing: a => m.setFaceBearing(viewer, a.bearing),
    setGrid: a => m.setGrid(viewer, a.visible),
    setCardinals: a => m.setCardinals(viewer, a.visible),
    // The page's colours are CSS variables on <html>; the viewer reads them and repaints on gsthemechange.
    setTheme: (a, notify = true) => {
      const theme = ['day', 'dusk', 'night'].includes(a.theme) ? a.theme : null;
      if (theme) document.documentElement.dataset.theme = theme;
      else delete document.documentElement.dataset.theme;
      if (notify) window.dispatchEvent(new Event('gsthemechange'));
    },
    // The host sends the chips ready to show (it formats the values); visible = false clears them.
    setCoordinates: a => {
      const box = document.getElementById('coords');
      box.replaceChildren();
      if (!a.visible) return;
      for (const item of a.items ?? []) {
        const chip = document.createElement('span');
        chip.className = item.ra ? 'coord ra' : 'coord';
        if (item.title) chip.title = item.title;
        const label = document.createElement('span');
        label.className = 'label';
        label.textContent = item.label;
        const value = document.createElement('span');
        value.className = 'value';
        value.textContent = item.value;
        chip.append(label, value);
        if (item.ra) chip.addEventListener('dblclick', () => post({ event: 'toggleRa' }));
        box.append(chip);
      }
    },
    // Sizes the canvas again and asks for a frame (a view that was hidden has not been drawing).
    refresh: () => viewer.resize(),
    setHeading: a => {
      const button = document.getElementById('heading');
      button.hidden = !a.visible;
      m.setHeadingElement(viewer, a.visible ? button : null);
    },
    setCardinalSize: a => m.setCardinalSize(viewer, a.size),
    setHemisphere: a => m.setHemisphere(viewer, a.northern),
    getCamera: async () => post({ event: 'camera', view: await m.getCamera(viewer) }),
  };

  window.chrome.webview.addEventListener('message', e => {
    const a = e.data;
    queue = queue.then(async () => {
      if (!viewer && a.cmd !== 'create') return;
      await commands[a.cmd]?.(a);
    }).catch(err => {
      document.getElementById('msg').textContent = String(err?.message ?? err);
      post({ event: 'error', message: String(err?.message ?? err) });
    });
  });
  post({ event: 'ready' });
</script>
</body>
</html>
